<script>
/* itsdrdan.github.io: fixes wrong capitalization in addresses (e.g. /mcat -> /MCAT/)
   and sends the bare address to the chemistry Study Hub. */
(function () {
  var REPOS = ["MCAT","games","labpractical","questionbank","retakeprepCHEM3A","textbook","finalexam","enzymes","chem1bready",
    "quantumchemistry","organic","ionicformula","polyatomic","elements","metric","redox","golinks","algebratrainer","stoichiometry",
    "lipids","gaslaws","thermochemistry","organicreactions","pHcharge","aminoacids","reactions","lewisstructures","stereochemistry",
    "moles","functionalgroups","demonstrations","nucleicacids","metabolism","carbohydrates","sigfig"];
  var ALIAS = {"premed":"MCAT","pulse":"MCAT/practice.html","hub":"games","studyhub":"games"};
  var parts = location.pathname.replace(/^\/+/, "").split("/");
  var first = (parts.shift() || "").toLowerCase();
  var target = "games/";
  if (first) {
    var hit = null;
    for (var i = 0; i < REPOS.length; i++) if (REPOS[i].toLowerCase() === first) { hit = REPOS[i]; break; }
    if (hit) target = hit + "/" + parts.join("/");
    else if (ALIAS.hasOwnProperty(first)) target = ALIAS[first] + (ALIAS[first].indexOf(".html") < 0 ? "/" + parts.join("/") : "");
  }
  var url = "/" + target.replace(/\/+/g, "/");
  if (url === location.pathname) url = "/games/";
  location.replace(url + location.search + location.hash);
})();
</script>
